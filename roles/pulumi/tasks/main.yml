- name: assert pulumi supports this architecture
  assert:
    that: ansible_architecture == "x86_64"
    fail_msg: "pulumi role only supports x86_64 (got {{ ansible_architecture }})"

- name: Find the latest version of Pulumi
  uri:
    url: https://www.pulumi.com/latest-version
    return_content: yes
  register: pulumi_latest_version
  check_mode: no

- name: Define Pulumi version to install
  set_fact:
    pulumi_version_to_install: "{{ pulumi_latest_version.content }}"

- name: Check if Pulumi is present with the right version
  command: "$HOME/.local/bin/pulumi version"
  register: pulumi_installed_version
  ignore_errors: true
  changed_when: false
  failed_when: false

- name: Install Pulumi
  when: pulumi_version_to_install not in pulumi_installed_version.stdout | default('')
  block:
    # unarchive requires directory to exist
    - name: ensure install directory exists
      file:
        state: directory
        path: "{{ ansible_env.HOME }}/.local/bin"

    - name: install cosign for signature verification
      get_url:
        url: "https://github.com/sigstore/cosign/releases/download/{{ pulumi_cosign_version }}/cosign-linux-amd64"
        dest: "{{ ansible_env.HOME }}/.local/bin/cosign"
        mode: "0755"
        checksum: "{{ pulumi_cosign_checksum }}"

    - name: create temp dir for pulumi download
      tempfile:
        state: directory
      register: pulumi_tmp

    - name: download pulumi tarball
      get_url:
        url: "https://github.com/pulumi/pulumi/releases/download/v{{ pulumi_version_to_install }}/pulumi-v{{ pulumi_version_to_install }}-linux-x64.tar.gz"
        dest: "{{ pulumi_tmp.path }}/pulumi.tar.gz"
        mode: "0644"

    - name: download pulumi sigstore bundle
      get_url:
        url: "https://github.com/pulumi/pulumi/releases/download/v{{ pulumi_version_to_install }}/pulumi-v{{ pulumi_version_to_install }}-linux-x64.tar.gz.sig"
        dest: "{{ pulumi_tmp.path }}/pulumi.tar.gz.sig"
        mode: "0644"

    # pulumi ships a legacy cosign bundle (.sig); if a cosign bump drops
    # --bundle support for it, this step fails and the molecule test catches it
    - name: verify pulumi tarball signature with cosign
      command:
        argv:
          - "{{ ansible_env.HOME }}/.local/bin/cosign"
          - verify-blob
          - --bundle
          - "{{ pulumi_tmp.path }}/pulumi.tar.gz.sig"
          - --certificate-identity-regexp
          - '^https://github\.com/pulumi/pulumi/\.github/workflows/sign\.yml@.+$'
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - "{{ pulumi_tmp.path }}/pulumi.tar.gz"
      changed_when: false

    - name: extract pulumi
      unarchive:
        src: "{{ pulumi_tmp.path }}/pulumi.tar.gz"
        dest: "{{ ansible_env.HOME }}/.local/bin"
        extra_opts: [--strip-components=1]
        mode: "0755"
        remote_src: yes
  always:
    - name: remove temp dir
      file:
        path: "{{ pulumi_tmp.path }}"
        state: absent
      when: pulumi_tmp.path is defined
