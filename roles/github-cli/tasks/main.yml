- name: Remove legacy github cli key and source
  become: true
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/githubcli-archive-keyring.gpg
    # binary key the module fetched while signed_by was a URL
    - /etc/apt/keyrings/github-cli.gpg
    - /etc/apt/sources.list.d/github-cli.list

- name: Install github cli signing key
  become: true
  copy:
    src: github-cli.asc
    dest: /etc/apt/keyrings/github-cli.asc
    mode: "0644"

- name: Add github cli repository
  become: true
  deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/github-cli.asc
    install_python_debian: true

- name: Install gh
  become: true
  apt:
    name: gh
    state: latest
    update_cache: true

- name: Check gh auth status
  command: gh auth status
  register: gh_auth
  changed_when: false
  failed_when: false

- name: Manage gh extensions
  when: gh_auth.rc == 0
  block:
    - name: Check installed gh extensions
      shell: gh extension list | grep act
      register: gh_extensions
      changed_when: false
      failed_when: false

    - name: Get latest gh-act release tag
      uri:
        url: https://api.github.com/repos/nektos/gh-act/releases/latest
      register: gh_act_release

    - name: Install gh-act extension
      command: gh extension install nektos/gh-act
      changed_when: true
      when: "'nektos/gh-act' not in gh_extensions.stdout"

    - name: Update gh-act extension
      command: gh extension upgrade act
      register: gh_act_upgrade
      changed_when: true
      when:
        - "'nektos/gh-act' in gh_extensions.stdout"
        - "gh_act_release.json.tag_name not in gh_extensions.stdout"
