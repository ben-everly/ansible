- name: Remove legacy vagrant key and source
  become: true
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/trusted.gpg.d/vagrant.asc
    - /etc/apt/sources.list.d/vagrant.list

- name: Install vagrant signing key
  become: true
  copy:
    src: vagrant.asc
    dest: /etc/apt/keyrings/vagrant.asc
    mode: "0644"

- name: Add vagrant repository
  become: true
  deb822_repository:
    name: vagrant
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/vagrant.asc
    install_python_debian: true

- name: Install apt packages
  become: true
  apt:
    name:
      - virtualbox
      - vagrant
    state: latest
    update_cache: true
