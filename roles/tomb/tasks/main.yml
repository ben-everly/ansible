- name: Check if tomb is installed
  shell:
    cmd: which tomb
  changed_when: false
  failed_when: result.rc != 0 and result.rc != 1
  register: result

- name: Install tomb
  when: result.rc == 1
  block:
    - name: Install apt packages
      become: true
      apt:
        name:
          - cryptsetup
          - file
          - gnupg
          - make
          - pinentry-curses
          - sudo
          - zsh
        state: latest
        update_cache: true

    - name: Make temp dir
      tempfile:
        state: directory
      register: tmp_dir

    - name: Download tomb
      get_url:
        url: https://files.dyne.org/tomb/releases/Tomb-2.9.tar.gz
        dest: "{{ tmp_dir.path }}/tomb.tar.gz"
        checksum: "sha256:b3a23c6680815f7557a3c4bd73d2b2dbde870a62357fcbf9b33089afae75d68c"

    - name: Extract tomb
      unarchive:
        src: "{{ tmp_dir.path }}/tomb.tar.gz"
        dest: "{{ tmp_dir.path }}"
        remote_src: true

    - name: Run make
      become: true
      make:
        chdir: "{{ tmp_dir.path }}/Tomb-2.9"
        target: install

    - name: Remove tmp dir
      file:
        path: "{{ tmp_dir.path }}"
        state: absent
