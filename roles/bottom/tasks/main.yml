---
- name: Assert bottom supports this architecture
  assert:
    that: ansible_architecture == "x86_64"
    fail_msg: "bottom role only supports x86_64 (got {{ ansible_architecture }})"

- name: Check if bottom is installed
  shell:
    cmd: which btm
  changed_when: false
  failed_when: result.rc != 0 and result.rc != 1
  register: result

- name: Install bottom
  when: result.rc == 1
  block:
    - name: Make temp dir
      tempfile:
        state: directory
      register: tmp_dir

    # -1 is the deb revision; release tags don't carry it.
    - name: Download bottom deb
      get_url:
        url: "https://github.com/ClementTsang/bottom/releases/download/{{ bottom_version }}/bottom_{{ bottom_version }}-1_amd64.deb"
        dest: "{{ tmp_dir.path }}/bottom.deb"
        checksum: "sha256:{{ bottom_deb_sha256 }}"

    - name: Install bottom
      become: true
      apt:
        deb: "{{ tmp_dir.path }}/bottom.deb"
