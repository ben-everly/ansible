---
- name: Assert bottom supports this architecture
  assert:
    that: ansible_architecture == "x86_64"
    fail_msg: "bottom role only supports x86_64 (got {{ ansible_architecture }})"

# Bare `btm` on PATH can resolve to a cargo or asdf install this role doesn't manage.
- name: Check installed bottom version
  command:
    cmd: /usr/bin/btm --version
  changed_when: false
  failed_when: false
  check_mode: no
  register: bottom_installed

- name: Determine the installed bottom version
  set_fact:
    bottom_installed_version: >-
      {{ bottom_installed.stdout | regex_search('^bottom\s+(\S+)', '\1') | default([''], true) | first }}

- name: Install bottom
  when: bottom_installed_version != bottom_version
  block:
    - name: Make temp dir
      tempfile:
        state: directory
      register: tmp_dir

    # -1 is the deb revision; release tags don't carry it.
    - name: Download bottom deb
      get_url:
        url: "https://github.com/ClementTsang/bottom/releases/download/{{ bottom_version }}/bottom_{{ bottom_version }}-1_amd64.deb"
        dest: "{{ tmp_dir.path }}/bottom.deb"
        checksum: "sha256:{{ bottom_deb_sha256 }}"

    - name: Install bottom
      become: true
      apt:
        deb: "{{ tmp_dir.path }}/bottom.deb"
        allow_downgrade: true
  always:
    - name: Remove tmp dir
      file:
        path: "{{ tmp_dir.path }}"
        state: absent
      when: tmp_dir.path is defined
