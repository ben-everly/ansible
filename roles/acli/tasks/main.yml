- name: remove legacy acli key and source
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/acli-archive-keyring.asc
    - /etc/apt/keyrings/acli-archive-keyring.gpg
    - /etc/apt/sources.list.d/acli.list

- name: add acli repository
  deb822_repository:
    name: acli
    types: deb
    uris: https://acli.atlassian.com/linux/deb
    suites: stable
    components: main
    signed_by: https://acli.atlassian.com/gpg/public-key.asc
    install_python_debian: true

- name: install acli
  apt:
    name: acli
    state: latest
    update_cache: true
