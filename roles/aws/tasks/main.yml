---
- name: Assert aws-cli supports this architecture
  assert:
    that: ansible_architecture == "x86_64"
    fail_msg: "aws role only supports x86_64 (got {{ ansible_architecture }})"

# Bare `aws` on PATH can resolve to an asdf shim or a legacy /snap/bin/aws, neither
# of which this role manages.
- name: Check installed aws-cli version
  command:
    cmd: /usr/local/bin/aws --version
  changed_when: false
  failed_when: false
  check_mode: no
  register: aws_installed_version

# stderr is folded in because not every aws-cli version prints --version to stdout.
- name: Determine the installed aws-cli version
  set_fact:
    aws_installed_cli_version: >-
      {{ ((aws_installed_version.stdout | default('')) ~ (aws_installed_version.stderr | default('')))
      | regex_search('aws-cli/([0-9.]+)', '\1') | default([''], true) | first }}

# Gated on the version rather than mere presence, so a pin bump upgrades hosts the
# role has already provisioned.
- name: Install aws-cli
  when: aws_installed_cli_version != aws_cli_version
  block:
    - name: Install apt packages
      become: true
      apt:
        name:
          - unzip
          - gnupg
        state: present
        update_cache: true

    - name: Make temp dir
      tempfile:
        state: directory
      register: tmp_dir

    - name: Create a throwaway gpg keyring
      file:
        path: "{{ tmp_dir.path }}/gnupg"
        state: directory
        mode: "0700"

    - name: Stage the AWS CLI signing key
      copy:
        src: aws-cli.asc
        dest: "{{ tmp_dir.path }}/aws-cli.asc"
        mode: "0644"

    - name: Import the AWS CLI signing key
      command:
        cmd: "gpg --homedir {{ tmp_dir.path }}/gnupg --batch --import {{ tmp_dir.path }}/aws-cli.asc"
      changed_when: false

    - name: Read fingerprints from the throwaway keyring
      command:
        cmd: "gpg --homedir {{ tmp_dir.path }}/gnupg --batch --with-colons --fingerprint"
      changed_when: false
      register: aws_cli_keyring

    # Three ways a bad re-vendor would otherwise slip past: a second key in the .asc
    # is trusted alongside the expected one; uid text is copied verbatim from the file,
    # so only the computed fpr: record proves identity; and gpg --verify exits 0 under
    # an expired key.
    - name: Assert the keyring holds only the expected, still-valid key
      assert:
        that:
          - aws_cli_keyring.stdout | regex_findall('^pub:', multiline=True) | length == 1
          - aws_cli_keyring.stdout | regex_findall('^fpr:::::::::([0-9A-F]+):', multiline=True) | first == aws_cli_key_fingerprint
          - aws_cli_keyring.stdout | regex_findall('^pub:([^:]*):', multiline=True) | first not in ['e', 'r']
        fail_msg: >-
          vendored aws-cli signing key must be exactly one valid key with fingerprint
          {{ aws_cli_key_fingerprint }} — re-vendor it from AWS's published key

    - name: Download aws-cli v2 zip
      get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ aws_cli_version }}.zip"
        dest: "{{ tmp_dir.path }}/awscliv2.zip"

    - name: Download aws-cli v2 signature
      get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ aws_cli_version }}.zip.sig"
        dest: "{{ tmp_dir.path }}/awscliv2.zip.sig"

    - name: Verify aws-cli signature against the vendored key
      command:
        cmd: "gpg --homedir {{ tmp_dir.path }}/gnupg --batch --verify {{ tmp_dir.path }}/awscliv2.zip.sig {{ tmp_dir.path }}/awscliv2.zip"
      changed_when: false

    - name: Extract aws-cli
      unarchive:
        src: "{{ tmp_dir.path }}/awscliv2.zip"
        dest: "{{ tmp_dir.path }}"
        remote_src: true

    # Without --update the installer refuses to run over an existing install.
    # Idempotence comes from the version gate above, hence no creates:.
    - name: Run aws-cli installer
      become: true
      command:
        cmd: "{{ tmp_dir.path }}/aws/install --update"
  always:
    - name: Remove tmp dir
      file:
        path: "{{ tmp_dir.path }}"
        state: absent
      when: tmp_dir.path is defined
