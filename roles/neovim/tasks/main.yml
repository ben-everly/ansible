- name: Install apt packages
  become: true
  apt:
    name:
      - universal-ctags
      - libfuse2
    state: latest
    update_cache: true

- name: Register github api for neovim latest release
  uri:
    url: https://api.github.com/repos/neovim/neovim/releases/latest
  register: neovim

# upstream publishes no checksums or signatures for release assets
# (checked v0.12.x), so HTTPS is the only integrity guarantee available
- name: Download nvim appimage
  get_url:
    url: "{{ neovim.json.assets | selectattr('name', 'equalto', 'nvim-linux-x86_64.appimage') | map(attribute='browser_download_url') | first }}"
    dest: $HOME/.local/bin/nvim
    mode: "755"

- name: Check for pip
  shell: command -v pip
  register: pip_check
  changed_when: false
  failed_when: false

- name: Install pip packages
  when: pip_check.rc == 0
  pip:
    name: pynvim
    state: latest
    executable: pip

- name: Check for pip2
  shell: command -v pip2
  register: pip2_check
  changed_when: false
  failed_when: false

- name: Install pip2 packages
  when: pip2_check.rc == 0
  pip:
    name: pynvim
    state: latest
    executable: pip2

- name: Check for gem
  shell: command -v gem
  register: gem_check
  changed_when: false
  failed_when: false

- name: Install ruby packages
  when: gem_check.rc == 0
  gem:
    name: neovim
    state: latest
    executable: gem

- name: Check for npm
  shell: command -v npm
  register: npm_check
  changed_when: false
  failed_when: false

- name: Install node neovim packages
  when: npm_check.rc == 0
  npm:
    name: "{{ item }}"
    global: true
    state: latest
    executable: npm
  with_items:
    - neovim
    - yarn
    - tree-sitter-cli

- name: Check for cpanm
  shell: command -v cpanm
  register: cpanm_check
  changed_when: false
  failed_when: false

- name: Install cpan packages
  when: cpanm_check.rc == 0
  cpanm:
    name: "{{ item }}"
    notest: true
    executable: cpanm
  with_items:
    - Neovim::Ext
    - App::cpanminus

- name: Warn about provider runtimes missing from PATH
  vars:
    provider_checks:
      pip: "{{ pip_check }}"
      pip2: "{{ pip2_check }}"
      gem: "{{ gem_check }}"
      npm: "{{ npm_check }}"
      cpanm: "{{ cpanm_check }}"
    missing_providers: "{{ provider_checks | dict2items | rejectattr('value.rc', 'eq', 0) | map(attribute='key') | list }}"
  debug:
    msg: "WARNING: provider runtimes not on PATH, installs skipped: {{ missing_providers | join(', ') }}"
  when: missing_providers | length > 0
