- name: Install apt packages
  become: true
  apt:
    name:
      - universal-ctags
      - libfuse2
      - python3-venv
      - ruby-dev
      - build-essential
    state: latest
    update_cache: true

- name: Register github api for neovim latest release
  uri:
    url: https://api.github.com/repos/neovim/neovim/releases/latest
  register: neovim

# upstream publishes no checksums or signatures (as of v0.12)
- name: Download nvim appimage
  get_url:
    url: "{{ neovim.json.assets | selectattr('name', 'equalto', 'nvim-linux-x86_64.appimage') | map(attribute='browser_download_url') | first }}"
    dest: $HOME/.local/bin/nvim
    mode: "755"

- name: Check python provider venv
  command: "{{ ansible_env.HOME }}/.local/share/nvim/venv/bin/python -c 'import pynvim'"
  register: pynvim_venv
  changed_when: false
  failed_when: false

# a system python upgrade leaves the venv pointing at the old site-packages
- name: Remove broken python provider venv
  file:
    path: "{{ ansible_env.HOME }}/.local/share/nvim/venv"
    state: absent
  when: pynvim_venv.rc != 0

- name: Install python provider
  pip:
    name: pynvim
    state: latest
    virtualenv: "{{ ansible_env.HOME }}/.local/share/nvim/venv"
    virtualenv_command: /usr/bin/python3 -m venv

- name: Link python provider onto PATH
  file:
    src: "{{ ansible_env.HOME }}/.local/share/nvim/venv/bin/pynvim-python"
    dest: "{{ ansible_env.HOME }}/.local/bin/pynvim-python"
    state: link

- name: Install ruby provider
  become: true
  # /usr/bin/gem is `#!/usr/bin/env ruby`, so keep asdf's ruby off PATH
  environment:
    PATH: "/usr/bin:/bin"
  gem:
    name: neovim
    state: latest
    user_install: false
    executable: /usr/bin/gem

- name: Install node neovim packages
  npm:
    name: "{{ item }}"
    global: true
    state: latest
    executable: npm
  with_items:
    - neovim
    - yarn
    - tree-sitter-cli

- name: Install cpan packages
  cpanm:
    name: "{{ item }}"
    notest: true
    executable: cpanm
  with_items:
    - Neovim::Ext
