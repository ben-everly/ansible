---
# system runtimes stand in for production's asdf, which is too slow to install here
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install provider runtimes for testing
      apt:
        name:
          - npm
          - cpanminus
          - libperl-dev
          - build-essential
        state: present
        update_cache: true

    - name: Ensure local bin directory exists
      file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: "0755"
