---
# The override lives here rather than in prepare: converge is what must target the
# older version, standing in for a pin that was bumped and then reverted.
# tests/test_default.py reads it back from here.
- name: Converge
  hosts: all
  vars:
    yazi_version: "v26.8.15"
    yazi_deb_sha256: "80e6434bf12ef5c17cf715ae0f17df15cc40459a5caf1dd12f8b377ae7e9361a"
  roles:
    - role: "{{ playbook_dir }}/../.."
