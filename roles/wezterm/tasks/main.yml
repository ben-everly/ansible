- name: add wezterm repository
  deb822_repository:
    name: wezterm
    types: deb
    uris: https://apt.fury.io/wez/
    suites: "*"
    components: "*"
    signed_by: https://apt.fury.io/wez/gpg.key
    install_python_debian: true

- name: Install apt packages
  apt:
    name: wezterm
    state: latest
    update_cache: true
