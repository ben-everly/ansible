- name: Remove legacy wezterm key and source
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/trusted.gpg.d/wezterm.asc
    - /etc/apt/sources.list.d/wezterm.list

- name: Add wezterm repository
  deb822_repository:
    name: wezterm
    types: deb
    uris: https://apt.fury.io/wez/
    suites: "*"
    components: "*"
    signed_by: https://apt.fury.io/wez/gpg.key
    install_python_debian: true

- name: Install apt packages
  apt:
    name: wezterm
    state: latest
    update_cache: true
