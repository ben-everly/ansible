- name: Find current version of handy
  command: dpkg-query -W -f='${Version}' handy
  register: current_version
  failed_when: false
  changed_when: false

- name: Find latest release of handy
  uri:
    url: https://api.github.com/repos/cjpais/Handy/releases/latest
  register: handy_release

- name: Install handy
  when: current_version.stdout != (handy_release.json.tag_name | replace('v', ''))
  block:
    - name: Assert release publishes the expected amd64 deb and signature
      assert:
        that:
          - handy_release.json.assets | selectattr('name', 'match', '.*amd64[.]deb$') | list | length == 1
          - handy_release.json.assets | selectattr('name', 'match', '.*amd64[.]deb[.]sig$') | list | length == 1
        fail_msg: >-
          Release {{ handy_release.json.tag_name }} is missing the expected
          amd64 .deb and/or .deb.sig asset; refusing to install unverified.
          Assets found: {{ handy_release.json.assets | map(attribute='name') | list }}

    - name: Make temp dir
      tempfile:
        state: directory
      register: tmp_dir

    - name: Set asset
      set_fact:
        asset: "{{ handy_release.json.assets | selectattr('name', 'match', '.*amd64[.]deb$') | first }}"
        sig_asset: "{{ handy_release.json.assets | selectattr('name', 'match', '.*amd64[.]deb[.]sig$') | first }}"

    - name: Install minisign for signature verification
      become: true
      apt:
        name: minisign
        state: present
        update_cache: true

    - name: Download handy
      get_url:
        url: "{{ asset.browser_download_url }}"
        dest: "{{ tmp_dir.path }}/{{ asset.name }}"

    - name: Download handy signature
      get_url:
        url: "{{ sig_asset.browser_download_url }}"
        dest: "{{ tmp_dir.path }}/{{ sig_asset.name }}"

    - name: Decode tauri signature to minisign format
      shell: base64 -d "{{ tmp_dir.path }}/{{ sig_asset.name }}" > "{{ tmp_dir.path }}/handy.minisig"
      changed_when: false

    - name: Stat the decoded signature
      stat:
        path: "{{ tmp_dir.path }}/handy.minisig"
      register: handy_minisig

    - name: Assert the decoded signature is non-empty
      assert:
        that:
          - handy_minisig.stat.size > 0
        fail_msg: >-
          Decoded signature is empty; the {{ sig_asset.name }} download is
          corrupt or unexpected. Refusing to install unverified.

    - name: Verify handy signature against pinned key
      command:
        argv:
          - minisign
          - -V
          - -P
          - "{{ handy_minisign_pubkey }}"
          - -m
          - "{{ tmp_dir.path }}/{{ asset.name }}"
          - -x
          - "{{ tmp_dir.path }}/handy.minisig"
      register: handy_verify
      changed_when: false
      failed_when: false

    - name: Assert the signature verified against the pinned key
      assert:
        that:
          - handy_verify.rc == 0
        fail_msg: >-
          minisign could not verify {{ asset.name }} against the pinned key.
          If cjpais/Handy rotated its Tauri updater key, re-pin
          handy_minisign_pubkey (roles/handy/defaults/main.yml) from
          src-tauri/tauri.conf.json after re-establishing trust.
          minisign: {{ handy_verify.stderr }}

    - name: Install handy
      apt:
        deb: "{{ tmp_dir.path }}/{{ asset.name }}"
      become: true

    - name: Remove temp dir
      file:
        path: "{{ tmp_dir.path }}"
        state: absent
