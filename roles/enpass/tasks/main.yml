- name: Remove legacy enpass apt source
  file:
    path: /etc/apt/sources.list.d/enpass.list
    state: absent

- name: Add enpass repository
  deb822_repository:
    name: enpass
    types: deb
    uris: https://apt.enpass.io/
    suites: stable
    components: main
    signed_by: https://apt.enpass.io/keys/enpass-linux.key
    install_python_debian: true

- name: Install apt packages
  apt:
    name: enpass
    state: latest
    update_cache: true

# the enpass .deb postinst installs a globally-trusted copy of the signing key
# into trusted.gpg.d; it is redundant with the scoped signed-by key above, so
# strip it to keep trust scoped to this repo
- name: Remove redundant global enpass key installed by the .deb
  file:
    path: /etc/apt/trusted.gpg.d/enpass.asc
    state: absent
